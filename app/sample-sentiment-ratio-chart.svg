<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="560" height="260" fill="#ffffff" rx="4"/>

  <!-- Donut chart: center (210,130) radius 90, inner radius 52 -->
  <!-- Positive: 62% = 223.2deg, Negative: 18% = 64.8deg, Neutral: 20% = 72deg -->

  <!-- Arc math (SVG): start from top (-90deg) going clockwise -->
  <!-- Positive (green): 0° to 223.2° -->
  <!-- Start: (210+90*cos(-90°), 130+90*sin(-90°)) = (210, 40) -->
  <!-- End at 223.2° from top: angle = -90+223.2 = 133.2° -->
  <!-- cos(133.2°)=-0.688, sin(133.2°)=0.726 → (210+90*-0.688, 130+90*0.726) = (148.1, 195.3) -->
  <path d="M 210 40
           A 90 90 0 1 1 148.1 195.3
           L 175.7 144.2
           A 52 52 0 1 0 210 78
           Z"
        fill="#107c10" opacity="0.85"/>

  <!-- Negative (red): 223.2° to 288° (64.8°) -->
  <!-- Start: 133.2° → (148.1,195.3) -->
  <!-- End: 133.2+64.8=198° from 0 → angle = -90+288 = 198° -->
  <!-- cos(198°)=-0.951, sin(198°)=-0.309 → (210+90*-0.951, 130+90*-0.309) = (124.4, 102.2) -->
  <path d="M 148.1 195.3
           A 90 90 0 0 1 124.4 102.2
           L 152.7 117.8
           A 52 52 0 0 0 175.7 144.2
           Z"
        fill="#a4262c" opacity="0.85"/>

  <!-- Neutral (gray): 288° to 360° (72°) -->
  <!-- Start: 198° → (124.4,102.2) -->
  <!-- End: back to top (210,40) -->
  <path d="M 124.4 102.2
           A 90 90 0 0 1 210 40
           L 210 78
           A 52 52 0 0 0 152.7 117.8
           Z"
        fill="#a19f9d" opacity="0.85"/>

  <!-- Center hole (white) -->
  <circle cx="210" cy="130" r="52" fill="#ffffff"/>

  <!-- Center label -->
  <text x="210" y="124" fill="#323130" font-size="13" font-weight="600" text-anchor="middle">感情分析</text>
  <text x="210" y="142" fill="#605e5c" font-size="11" text-anchor="middle">直近 7 日間</text>

  <!-- Right side: Legend with bar chart illustration -->
  <text x="330" y="55" fill="#323130" font-size="13" font-weight="600">感情別の内訳</text>

  <!-- Positive bar -->
  <text x="330" y="85"  fill="#107c10" font-size="12" font-weight="600">● Positive</text>
  <rect x="330" y="92"  width="186" height="18" rx="3" fill="#f3f2f1"/>
  <rect x="330" y="92"  width="115" height="18" rx="3" fill="#107c10" opacity="0.75"/>
  <text x="452" y="105" fill="#107c10" font-size="12" font-weight="700">62%</text>

  <!-- Negative bar -->
  <text x="330" y="130" fill="#a4262c" font-size="12" font-weight="600">● Negative</text>
  <rect x="330" y="137" width="186" height="18" rx="3" fill="#f3f2f1"/>
  <rect x="330" y="137" width="33"  height="18" rx="3" fill="#a4262c" opacity="0.75"/>
  <text x="452" y="150" fill="#a4262c" font-size="12" font-weight="700">18%</text>

  <!-- Neutral bar -->
  <text x="330" y="175" fill="#605e5c" font-size="12" font-weight="600">● Neutral</text>
  <rect x="330" y="182" width="186" height="18" rx="3" fill="#f3f2f1"/>
  <rect x="330" y="182" width="37"  height="18" rx="3" fill="#a19f9d" opacity="0.75"/>
  <text x="452" y="195" fill="#605e5c" font-size="12" font-weight="700">20%</text>

  <!-- Total label -->
  <text x="330" y="230" fill="#323130" font-size="11">総投稿数: 1,248 件</text>
  <text x="330" y="246" fill="#605e5c" font-size="10">※ 感情分析: 日本語 BERT モデル（暫定）</text>

  <!-- Donut callout lines -->
  <!-- Positive callout -->
  <line x1="210" y1="40" x2="210" y2="20" stroke="#107c10" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="210" y="16" fill="#107c10" font-size="10" text-anchor="middle" font-weight="600">62%</text>

  <!-- Negative callout -->
  <line x1="124.4" y1="102.2" x2="104" y2="90" stroke="#a4262c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="100" y="86" fill="#a4262c" font-size="10" text-anchor="end" font-weight="600">18%</text>
</svg>
