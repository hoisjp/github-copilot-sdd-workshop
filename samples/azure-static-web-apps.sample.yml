# 参照専用のサンプルです。この場所にある間は GitHub Actions として実行されません。
# sdd-4-pipeline エージェントがこれを土台に .github/workflows/azure-static-web-apps.yml を生成します。
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/azure-static-web-apps.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/azure-static-web-apps.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      # app/ is empty until a participant generates a wireframe, and SWA fails without an entry point.
      - name: Check for app entry point
        id: appcheck
        run: |
          if [ -f app/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "app/index.html not found. Generate it with the sdd-3-wireframe agent first. Skipping deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build And Deploy
        id: builddeploy
        if: steps.appcheck.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "app"
          api_location: ""
          output_location: ""
          # Plain HTML/JS wireframe: no build step to run.
          skip_app_build: true
        env:
          # The token is registered during the sdd-4-pipeline step; skip instead of failing before then.
          SKIP_DEPLOY_ON_MISSING_SECRETS: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          app_location: "app"
